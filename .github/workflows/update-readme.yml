name: Update README

on:
  push:
    branches: [main]
    paths:
      - "Formula/**.rb"
      - "Casks/**.rb"
      - "*.rb"
      - "scripts/update-readme.rb"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "Formula/**.rb"
      - "Casks/**.rb"
      - "*.rb"
      - "scripts/update-readme.rb"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # On a PR from a fork we can't push, so just report that the table is stale.
      - name: Check README is up to date
        if: github.event_name == 'pull_request'
        run: ruby scripts/update-readme.rb --check

      - name: Regenerate README
        if: github.event_name != 'pull_request'
        run: ruby scripts/update-readme.rb

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README package list"
          git push
